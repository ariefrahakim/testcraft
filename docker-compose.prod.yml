name: testcraft-prod

# Production Docker Compose — uses pre-built images from ghcr.io.
#
# Required environment variables (set in /opt/testcraft/.env on the VPS):
#   DB_USER, DB_PASSWORD, DB_NAME
#   REDIS_PASSWORD
#   JWT_SECRET, JWT_REFRESH_SECRET
#   CORS_ORIGINS
#   MIDTRANS_SERVER_KEY
#   NEXT_PUBLIC_API_URL, NEXT_PUBLIC_LMS_URL, NEXT_PUBLIC_SITE_URL
#   GITHUB_REPOSITORY   (e.g. ariefrahakim/testcraft)
#   IMAGE_TAG           (defaults to latest)

services:
  # ── Reverse proxy ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: testcraft-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
      - marketing

  # ── Database ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: testcraft-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Intentionally no public port — only reachable by other containers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Cache ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: testcraft-prod-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── API (NestJS) ─────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/testcraft-api:${IMAGE_TAG:-latest}
    container_name: testcraft-prod-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:4001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── LMS Web (Next.js) ────────────────────────────────────────────────────────
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/testcraft-web:${IMAGE_TAG:-latest}
    container_name: testcraft-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Resolved by the browser — must be the public URL
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Resolved server-side within Docker network
      API_INTERNAL_URL: http://api:4001/api/v1

  # ── Marketing site (Next.js) ─────────────────────────────────────────────────
  marketing:
    image: ghcr.io/${GITHUB_REPOSITORY}/testcraft-marketing:${IMAGE_TAG:-latest}
    container_name: testcraft-prod-marketing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_LMS_URL: ${NEXT_PUBLIC_LMS_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://testcraft.id}

volumes:
  pgdata:
    name: testcraft-prod-pgdata
  redisdata:
    name: testcraft-prod-redisdata
