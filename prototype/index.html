<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestCraft Indonesia — Learn. Build. Automate.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0E9C9C; --blue-dark:#0B7E7E; --blue-light:#D5EFEE;
  --navy:#12283E; --navy-800:#1E293B; --navy-700:#334155;
  --light:#F8FAFC; --green:#10B981; --green-light:#D1FAE5;
  --amber:#F59E0B; --red:#EF4444; --purple:#8B5CF6;
  --bg:#F8FAFC; --card:#FFFFFF; --text:#12283E; --text-2:#475569; --text-3:#94A3B8;
  --border:#E2E8F0; --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.07);
  --shadow-lg:0 8px 40px rgba(15,23,42,.14);
  --radius:16px; --radius-sm:10px;
  --grad:linear-gradient(135deg,#0F2438 0%,#16506B 55%,#0E9C9C 100%);
  --grad-accent:linear-gradient(135deg,#0E9C9C,#2FBF9F);
}
html[data-theme="dark"]{
  --bg:#0B1220; --card:#111A2E; --text:#F1F5F9; --text-2:#CBD5E1; --text-3:#64748B;
  --border:#1E293B; --blue-light:#0E9C9C26; --green-light:#065F4633;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;line-height:1.25}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.flex{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--text-2)}.small{font-size:13px}.xs{font-size:12px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}.mb32{margin-bottom:32px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;transition:transform .2s,box-shadow .2s}
.card.hover:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:12px 24px;font-weight:600;font-size:15px;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark);transform:translateY(-1px);box-shadow:0 8px 20px rgba(14,156,156,.35)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--blue-light);color:var(--blue)}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:10px}
.btn-lg{padding:16px 32px;font-size:16px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-amber{background:#FEF3C7;color:#B45309}
html[data-theme="dark"] .badge-amber{background:#78350F33;color:#FBBF24}
.badge-red{background:#FEE2E2;color:#B91C1C}
html[data-theme="dark"] .badge-red{background:#7F1D1D33;color:#F87171}
.badge-purple{background:#EDE9FE;color:#6D28D9}
html[data-theme="dark"] .badge-purple{background:#4C1D9533;color:#A78BFA}
.badge-navy{background:var(--navy);color:#fff}
input,select,textarea{font-family:inherit;font-size:14px;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);width:100%;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{font-size:13px;font-weight:600;color:var(--text-2);display:block;margin-bottom:6px}
.progress{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:var(--grad-accent);border-radius:99px;transition:width .5s}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--grad-accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.avatar.lg{width:64px;height:64px;font-size:22px}
.avatar.sm{width:30px;height:30px;font-size:12px}
.stars{color:var(--amber);letter-spacing:1px;font-size:14px}
.section-title{font-size:32px;font-weight:700;text-align:center}
.section-sub{text-align:center;color:var(--text-2);max-width:600px;margin:12px auto 0}
.divider{height:1px;background:var(--border);margin:20px 0}
/* NAVBAR */
nav.topnav{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Poppins';font-weight:800;font-size:19px;white-space:nowrap}
.logo .shield{width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(15,23,42,.12);flex-shrink:0}
.logo b{color:var(--text)}.logo span{color:var(--blue)}
.nav-links{display:flex;gap:4px;flex:1}
.nav-links a{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-2)}
.nav-links a:hover,.nav-links a.active{background:var(--blue-light);color:var(--blue)}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:17px;position:relative}
.icon-btn:hover{border-color:var(--blue)}
.lang-dd{position:relative}
.lang-dd summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;justify-content:center}
.lang-dd summary::-webkit-details-marker{display:none}
.lang-menu{position:absolute;top:46px;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:400;min-width:104px}
.lang-menu button{display:flex;gap:8px;align-items:center;width:100%;padding:9px 12px;border:none;background:none;border-radius:8px;font-weight:600;font-size:13px;color:var(--text);cursor:pointer}
.lang-menu button:hover{background:var(--bg)}

.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.role-select{width:auto;padding:8px 12px;font-size:13px;font-weight:600;border-radius:10px}
/* HERO */
.hero{background:var(--grad);color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.25),transparent 65%);top:-200px;right:-150px}
.hero::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(14,156,156,.4),transparent 65%);bottom:-250px;left:-100px}
.hero-inner{max-width:1200px;margin:0 auto;padding:90px 24px 100px;position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
.hero h1{font-size:52px;font-weight:800;line-height:1.15}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#5EEAD4,#34D399);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:18px;color:#CBD5E1;margin-top:20px;max-width:540px}
.hero-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:20px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.hero-card .row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.hero-card .row:last-child{border:none}
.hero-card .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stats-band{max-width:1100px;margin:-52px auto 0;position:relative;z-index:5;padding:0 24px}
.stats-band .card{display:grid;grid-template-columns:repeat(4,1fr);padding:28px;gap:16px;text-align:center}
.stat-num{font-family:'Poppins';font-size:34px;font-weight:800;background:var(--grad-accent);-webkit-background-clip:text;background-clip:text;color:transparent}
/* COURSE CARD */
.course-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;cursor:pointer;display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.thumb{height:150px;position:relative;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff}
.thumb .lvl{position:absolute;top:12px;left:12px}
.thumb .dur{position:absolute;bottom:12px;right:12px;background:rgba(15,23,42,.75);color:#fff;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:600}
.course-body{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}
.course-body h3{font-size:16px;font-weight:600;font-family:'Inter'}
.price{font-family:'Poppins';font-weight:700;font-size:18px;color:var(--blue)}
.price s{color:var(--text-3);font-size:13px;font-weight:500;margin-left:8px}
/* CATEGORY chips */
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat-chip{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;transition:all .2s}
.cat-chip:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:var(--shadow)}
.cat-chip .ci{font-size:26px}
.cat-chip .cn{font-weight:600;font-size:13px;margin-top:8px}
/* PATH */
.path-card{position:relative;padding-left:0}
.path-steps{display:flex;flex-direction:column;gap:0;margin-top:14px}
.path-step{display:flex;gap:14px;position:relative;padding-bottom:18px}
.path-step::before{content:'';position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--border)}
.path-step:last-child::before{display:none}
.path-dot{width:32px;height:32px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;z-index:1}
/* FAQ */
details.faq{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0;margin-bottom:12px;overflow:hidden}
details.faq summary{padding:18px 22px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.faq summary::after{content:'+';font-size:22px;color:var(--blue);transition:transform .2s}
details.faq[open] summary::after{transform:rotate(45deg)}
details.faq .faq-body{padding:0 22px 18px;color:var(--text-2);font-size:14px}
/* FOOTER */
footer{background:var(--navy);color:#94A3B8;margin-top:80px}
footer .container{padding:60px 24px 30px}
footer h4{color:#fff;font-size:15px;margin-bottom:16px}
footer a{display:block;padding:5px 0;font-size:14px}
footer a:hover{color:#fff}
/* REGISTER SECTION */
.register-section{background:var(--grad);border-radius:24px;color:#fff;padding:56px;display:grid;grid-template-columns:1fr 1fr;gap:48px;position:relative;overflow:hidden}
.register-section::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.3),transparent 60%);top:-150px;right:-100px}
.register-form{background:#fff;border-radius:18px;padding:30px;color:var(--navy);position:relative;z-index:2}
html[data-theme="dark"] .register-form{background:var(--card);color:var(--text)}
.register-form input,.register-form select{margin-bottom:14px}
.wa-btn{background:#25D366;color:#fff;width:100%;justify-content:center}
.wa-btn:hover{filter:brightness(1.06)}
/* DASHBOARD LAYOUT */
.dash{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 68px)}
.dash-side{background:var(--card);border-right:1px solid var(--border);padding:24px 14px;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto}
.dash-side a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:11px;font-size:14px;font-weight:500;color:var(--text-2);margin-bottom:3px}
.dash-side a:hover{background:var(--bg)}
.dash-side a.active{background:var(--blue-light);color:var(--blue);font-weight:600}
.dash-main{padding:32px;max-width:1160px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .k-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:6px}
.kpi .k-val{font-family:'Poppins';font-size:26px;font-weight:700}
.kpi .k-delta{font-size:12px;font-weight:600}
.up{color:var(--green)}.down{color:var(--red)}
.welcome-banner{background:var(--grad);color:#fff;border-radius:20px;padding:32px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.welcome-banner::after{content:'🚀';position:absolute;font-size:120px;right:30px;bottom:-25px;opacity:.15}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{text-align:left;padding:11px 14px;color:var(--text-3);font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
table.tbl td{padding:13px 14px;border-bottom:1px solid var(--border)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:var(--bg)}
/* LEARNING UI */
.learn{display:grid;grid-template-columns:290px 1fr 320px;min-height:calc(100vh - 68px)}
.learn-side{background:var(--card);border-right:1px solid var(--border);overflow-y:auto;height:calc(100vh - 68px);position:sticky;top:68px}
.learn-right{background:var(--card);border-left:1px solid var(--border);height:calc(100vh - 68px);position:sticky;top:68px;display:flex;flex-direction:column}
.module-h{padding:14px 18px;font-weight:600;font-size:13.5px;background:var(--bg);border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between}
.lesson{padding:11px 18px;font-size:13.5px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text-2)}
.lesson:hover{background:var(--bg)}
.lesson.active{background:var(--blue-light);color:var(--blue);font-weight:600;border-left:3px solid var(--blue)}
.lesson.done .l-ic{color:var(--green)}
.player{background:#000;aspect-ratio:16/9;border-radius:16px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.player .play-big{width:76px;height:76px;border-radius:50%;background:rgba(14,156,156,.9);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;border:none}
.player .play-big:hover{transform:scale(1.1)}
.player-bar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:14px 18px;color:#fff;font-size:13px}
.player-track{height:5px;background:rgba(255,255,255,.25);border-radius:99px;margin-bottom:10px;cursor:pointer}
.player-track div{height:100%;width:34%;background:var(--blue);border-radius:99px;position:relative}
.player-track div::after{content:'';position:absolute;right:-6px;top:-4px;width:13px;height:13px;background:#fff;border-radius:50%}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;padding:13px;background:none;border:none;font-weight:600;font-size:13px;color:var(--text-3);border-bottom:2px solid transparent}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-body{padding:18px;overflow-y:auto;flex:1;font-size:13.5px}
/* QUIZ */
.quiz-opt{display:flex;align-items:center;gap:13px;padding:15px 18px;border:1.5px solid var(--border);border-radius:13px;cursor:pointer;margin-bottom:11px;transition:all .15s;background:var(--card)}
.quiz-opt:hover{border-color:var(--blue)}
.quiz-opt.sel{border-color:var(--blue);background:var(--blue-light)}
.quiz-opt.correct{border-color:var(--green);background:var(--green-light)}
.quiz-opt.wrong{border-color:var(--red);background:#FEE2E2}
html[data-theme="dark"] .quiz-opt.wrong{background:#7F1D1D33}
.quiz-opt .oL{width:30px;height:30px;border-radius:9px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.timer{font-family:'Poppins';font-weight:700;font-size:18px;color:var(--blue)}
/* CERTIFICATE */
.cert{background:linear-gradient(135deg,#fff,#F0F7FF);border:2px solid var(--blue);border-radius:20px;padding:44px;text-align:center;position:relative;color:#12283E;max-width:680px;margin:0 auto}
html[data-theme="dark"] .cert{background:linear-gradient(135deg,#111A2E,#0F1E3D);color:#F1F5F9}
.cert::before{content:'';position:absolute;inset:10px;border:1px solid var(--blue-light);border-radius:14px;pointer-events:none}
.qr{display:grid;grid-template-columns:repeat(11,7px);grid-auto-rows:7px;gap:1px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:8px;width:max-content;margin:0 auto}
.qr i{background:#12283E;border-radius:1px}
/* CHAT */
.ai-fab{position:fixed;bottom:26px;right:26px;width:60px;height:60px;border-radius:50%;background:var(--grad-accent);color:#fff;font-size:26px;border:none;box-shadow:0 10px 30px rgba(14,156,156,.4);z-index:200;transition:transform .2s}
.ai-fab:hover{transform:scale(1.08)}
.ai-panel{position:fixed;bottom:100px;right:26px;width:360px;height:480px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.ai-head{background:var(--grad);color:#fff;padding:16px 20px}
.ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:13.5px}
.ai-msg.bot{background:var(--bg);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.ai-msg.user{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:20px;max-width:460px;width:100%;padding:30px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 24px;border-radius:12px;font-size:14px;font-weight:500;z-index:400;box-shadow:var(--shadow-lg);animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(16px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .5s ease both}
/* leaderboard */
.lb-row{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--border)}
.lb-row:last-child{border:none}
.lb-rank{width:28px;height:28px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.lb-row.top1 .lb-rank{background:#FEF3C7;color:#B45309}
.lb-row.top2 .lb-rank{background:#E2E8F0;color:#475569}
.lb-row.top3 .lb-rank{background:#FFEDD5;color:#C2410C}
/* filters */
.filter-group{margin-bottom:22px}
.filter-group h4{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:10px}
.check{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;cursor:pointer;color:var(--text-2)}
.check input{width:16px;height:16px;padding:0;accent-color:var(--blue)}
/* curriculum */
.curr-mod{border:1px solid var(--border);border-radius:13px;margin-bottom:12px;overflow:hidden}
.curr-mod summary{padding:16px 20px;background:var(--bg);font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-size:14.5px}

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="9"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
    stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
   <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${size/5}" font-weight="700" fill="var(--text)" font-family="Poppins">${pct}%</text></svg>`}
</script>

/* ============ CATALOG ============ */
function catalogList(){
  const f=state.filters;
  let list=COURSES.filter(c=>
    (!f.cat.length||f.cat.includes(c.cat)) &&
    (!f.level.length||f.level.includes(c.level)) &&
    (!f.search||c.title.toLowerCase().includes(f.search.toLowerCase())||c.cat.toLowerCase().includes(f.search.toLowerCase())));
  if(f.sort==="popular")list.sort((a,b)=>b.students-a.students);
  if(f.sort==="rating")list.sort((a,b)=>b.rating-a.rating);
  if(f.sort==="priceLow")list.sort((a,b)=>a.priceIDR-b.priceIDR);
  if(f.sort==="priceHigh")list.sort((a,b)=>b.priceIDR-a.priceIDR);
  return list;
}

    <button class="btn btn-outline btn-sm mt16" onclick="resetFilters()">${t("↺ Reset Filters")}</button></div>`;
}

const fmtTime=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function pickAns(qi,oi,type){
  let a=state.quizAnswers[qi]||[];
  if(type==="multi"){a.includes(oi)?a=a.filter(x=>x!==oi):a.push(oi)}else a=[oi];
  state.quizAnswers[qi]=a;render();
}
function finishQuiz(){clearInterval(state.quizTimer);state.quizTimer=null;state.quizDone=true;render()}
function quizResults(){
  let correct=0;
  const rows=QUIZ.map((q,i)=>{

    else ok=JSON.stringify([...a].sort())===JSON.stringify([...q.ans].sort());
    if(ok)correct++;
    return {q,a,ok};
  });
  const pct=Math.round(correct/QUIZ.length*100),pass=pct>=80;
  return `<div class="container mt32" style="max-width:760px">

   </div>

     <div class="flex between"><b class="small">Q${i+1}. ${r.q.q}</b><span class="badge ${r.ok?"badge-green":"badge-red"}">${r.ok?"✓ Correct":"✗ Wrong"}</span></div>

  </div>`;
}

/* ============ NAV (updated: LMS portal + separate website) ============ */
function renderNav(){
  const links = state.role==="guest"
    ? `<a href="#/" data-r="/">${t("Login")}</a><a href="#/catalog" data-r="/catalog">${t("Courses")}</a><a href="#/verify" data-r="/verify">${t("Verify Certificate")}</a>`
    : state.role==="student"
    ? `<a href="#/dashboard" data-r="/dashboard">${t("Dashboard")}</a><a href="#/catalog" data-r="/catalog">${t("Catalog")}</a><a href="#/learn/1" data-r="/learn">${t("My Learning")}</a><a href="#/discussions" data-r="/discussions">${t("Forum")}</a>`
    : state.role==="instructor"
    ? `<a href="#/instructor" data-r="/instructor">${t("Studio")}</a><a href="#/instructor/courses" data-r="/instructor/courses">${t("My Courses")}</a><a href="#/instructor/assignments" data-r="/instructor/assignments">${t("Grading")}</a>`
    : state.role==="admin"
    ? `<a href="#/admin" data-r="/admin">${t("Analytics")}</a><a href="#/admin/users" data-r="/admin/users">${t("Users")}</a><a href="#/admin/cms" data-r="/admin/cms">CMS</a>`
    : `<a href="#/corporate" data-r="/corporate">${t("Team")}</a><a href="#/corporate/employees" data-r="/corporate/employees">${t("Employees")}</a><a href="#/corporate/reports" data-r="/corporate/reports">${t("Reports")}</a>`;
  $("#nav").innerHTML = `<nav class="topnav"><div class="nav-inner">
    <a class="logo" href="#/"><span class="shield"><svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><defs><linearGradient id="tcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A5C"/><stop offset=".55" stop-color="#16607C"/><stop offset="1" stop-color="#0E9C9C"/></linearGradient></defs><path d="M32 5 L55 13 V30 C55 45 44 55 32 59 C20 55 9 45 9 30 V13 Z" fill="none" stroke="url(#tcg)" stroke-width="5" stroke-linejoin="round"/><path d="M20 31 L30 41 L48 19" fill="none" stroke="#0E9C9C" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><b>TEST</b><span>CRAFT</span></span></a>
    <div class="nav-links">${links}<a href="https://ariefrahakim.github.io/testcraft-website/" target="_blank">🌐 Website</a></div>
    <select class="role-select" onchange="setRole(this.value)" title="Preview as role">
      ${["guest","student","instructor","admin","corporate"].map(r=>`<option value="${r}" ${state.role===r?"selected":""}>${r==="guest"?"👤 Guest":r==="student"?"🎓 Student":r==="instructor"?"👨‍🏫 Instructor":r==="admin"?"🛡️ Admin":"🏢 Corporate"}</option>`).join("")}
    </select>
    <details class="lang-dd">
      <summary class="icon-btn" style="width:auto;padding:0 10px;font-size:12px;font-weight:700">${state.lang==="id"?"🇮🇩":"🇬🇧"}&nbsp;${state.lang.toUpperCase()}&nbsp;<span style="font-size:9px">▾</span></summary>
      <div class="lang-menu">
        <button onclick="setLang('en')">🇬🇧 EN</button>
        <button onclick="setLang('id')">🇮🇩 ID</button>
      </div>
    </details>
    <button class="icon-btn" onclick="setCurrency(state.currency==='IDR'?'USD':'IDR')" title="Toggle currency" style="font-size:12px;font-weight:700">${state.currency}</button>
    <button class="icon-btn" onclick="setTheme(state.theme==='light'?'dark':'light')" title="Toggle theme">${state.theme==="light"?"🌙":"☀️"}</button>
    <button class="icon-btn" onclick="toast('${NOTIFS.length} notifications — see dashboard')" title="Notifications">🔔<span class="dot"></span></button>
    ${state.role==="guest"?`<button class="btn btn-primary btn-sm" onclick="openRegister()">${t("Register")}</button>`:`<span class="avatar" title="Signed in (demo)">AR</span>`}
  </div></nav>`;
  const r=location.hash.replace("#","")||"/";
  let best=null,bestLen=-1;
  document.querySelectorAll(".nav-links a[data-r]").forEach(a=>{
    const p=a.dataset.r;
    const match = r===p || (p!=="/" && r.startsWith(p) && (r.length===p.length || r[p.length]==="/"));
    if(match && p.length>bestLen){best=a;bestLen=p.length}
  });
  if(best)best.classList.add("active");
}
/* ============ ROUTER (LMS portal) ============ */
function as(role,fn){state.role=role;return fn()}
function render(){
  const h=location.hash.replace("#","")||"/";
  if(h!=="/quiz"&&state.quizTimer){clearInterval(state.quizTimer);state.quizTimer=null}
  const app=$("#app");
  window.scrollTo(0,0);
  const R={
   "/":viewLogin,"/login":viewLogin,
   "/catalog":viewCatalog,"/paths":viewPaths,"/quiz":viewQuiz,"/certificate":viewCertificate,"/verify":viewVerify,
   "/dashboard":()=>as(state.role==="guest"?"student":state.role,viewDashboard),
   "/discussions":()=>as("student",viewDiscussions),
   "/bookmarks":()=>as("student",viewBookmarks),
   "/wishlist":()=>as("student",viewWishlist),
   "/settings":()=>as("student",viewSettings),
   "/instructor":()=>as("instructor",viewInstructor),
   "/instructor/courses":()=>as("instructor",viewInstructorCourses),
   "/instructor/quizzes":()=>as("instructor",viewInstructorQuizzes),
   "/instructor/assignments":()=>as("instructor",viewInstructorAssignments),
   "/instructor/discussions":()=>as("instructor",viewInstructorDiscussions),
   "/instructor/messages":()=>as("instructor",viewInstructorMessages),
   "/instructor/settings":()=>as("instructor",viewInstructorSettings),
   "/admin":()=>as("admin",viewAdmin),
   "/admin/users":()=>as("admin",viewAdminUsers),
   "/admin/instructors":()=>as("admin",viewAdminInstructors),
   "/admin/categories":()=>as("admin",viewAdminCategories),
   "/admin/courses":()=>as("admin",viewAdminCourses),
   "/admin/enrollments":()=>as("admin",viewAdminEnrollments),
   "/admin/payments":()=>as("admin",viewAdminPayments),
   "/admin/certificates":()=>as("admin",viewAdminCertificates),
   "/admin/roles":()=>as("admin",viewAdminRoles),
   "/admin/cms":()=>as("admin",viewAdminCMS),
   "/admin/settings":()=>as("admin",viewAdminSettings),
   "/corporate":()=>as("corporate",viewCorporate),
   "/corporate/employees":()=>as("corporate",viewCorpEmployees),
   "/corporate/seats":()=>as("corporate",viewCorpSeats),
   "/corporate/reports":()=>as("corporate",viewCorpReports),
   "/corporate/billing":()=>as("corporate",viewCorpBilling),
   "/corporate/settings":()=>as("corporate",viewCorpSettings)
  };
  if(h.startsWith("/course/"))app.innerHTML=viewCourse(+h.split("/")[2]);
  else if(h.startsWith("/learn/")){if(state.role==="guest")state.role="student";app.innerHTML=viewLearn(+h.split("/")[2])}
  else if(R[h])app.innerHTML=R[h]();
  else app.innerHTML=viewLogin();
  renderNav();
}
window.addEventListener("hashchange",()=>render());
document.addEventListener("click",e=>{document.querySelectorAll(".lang-dd[open]").forEach(d=>{if(!d.contains(e.target))d.removeAttribute("open")})});
document.documentElement.dataset.theme=state.theme;
render();
</script>
