# Nginx reverse proxy configuration for TestCraft Indonesia
#
# Domains:
#   testcraft.id          → marketing app  (port 3001)
#   app.testcraft.id      → LMS web app    (port 3000)
#   api.testcraft.id      → NestJS API     (port 4001)

# ─── Shared proxy settings ────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Marketing site — testcraft.id ───────────────────────────────────────────
server {
    listen 80;
    server_name testcraft.id www.testcraft.id;

    # Redirect www → apex
    if ($host = www.testcraft.id) {
        return 301 https://testcraft.id$request_uri;
    }

    # HTTP → HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name testcraft.id www.testcraft.id;

    ssl_certificate     /etc/nginx/certs/testcraft.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/testcraft.id/privkey.pem;

    include /etc/nginx/certs/options-ssl-nginx.conf;

    # Redirect www → apex
    if ($host = www.testcraft.id) {
        return 301 https://testcraft.id$request_uri;
    }

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    location / {
        proxy_pass         http://marketing:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# ─── LMS web app — app.testcraft.id ──────────────────────────────────────────
server {
    listen 80;
    server_name app.testcraft.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.testcraft.id;

    ssl_certificate     /etc/nginx/certs/app.testcraft.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/app.testcraft.id/privkey.pem;

    include /etc/nginx/certs/options-ssl-nginx.conf;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# ─── API — api.testcraft.id ───────────────────────────────────────────────────
server {
    listen 80;
    server_name api.testcraft.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.testcraft.id;

    ssl_certificate     /etc/nginx/certs/api.testcraft.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.testcraft.id/privkey.pem;

    include /etc/nginx/certs/options-ssl-nginx.conf;

    client_max_body_size 50m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;

    location / {
        proxy_pass         http://api:4001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
