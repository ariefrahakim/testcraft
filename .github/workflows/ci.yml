name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Lint all workspaces
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint all workspaces
        run: npm run lint --workspaces --if-present

  # ─────────────────────────────────────────────────────────────────────────────
  # Type-check all workspaces
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check all workspaces
        run: npm run typecheck --workspaces --if-present

  # ─────────────────────────────────────────────────────────────────────────────
  # API — build + e2e tests (requires PostgreSQL service)
  # ─────────────────────────────────────────────────────────────────────────────
  api-test:
    name: API — Build & E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testcraft
          POSTGRES_PASSWORD: testcraft
          POSTGRES_DB: testcraft_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U testcraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://testcraft:testcraft@localhost:5433/testcraft_test?schema=public
      TEST_DATABASE_URL: postgresql://testcraft:testcraft@localhost:5433/testcraft_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply DB migrations
        run: npm run db:deploy --workspace @testcraft/api

      - name: Seed test data
        run: npm run db:seed --workspace @testcraft/api
        env:
          SEED_ADMIN_EMAIL: admin@testcraft.id
          SEED_ADMIN_PASSWORD: "Admin#12345"

      - name: Build API
        run: npm run build --workspace @testcraft/api

      - name: Run API e2e tests
        run: npm run test:e2e:quick --workspace @testcraft/api

      - name: Verify OpenAPI spec is up to date
        run: |
          npm run docs:openapi --workspace @testcraft/api
          git diff --exit-code docs/openapi.json \
            || (echo "::error::docs/openapi.json is stale. Run 'npm run docs:openapi' and commit the result." && exit 1)

  # ─────────────────────────────────────────────────────────────────────────────
  # Web (LMS) — typecheck + build
  # ─────────────────────────────────────────────────────────────────────────────
  web-build:
    name: Web — Typecheck & Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check web
        run: npm run typecheck --workspace @testcraft/web

      - name: Build web (LMS)
        run: npm run build --workspace @testcraft/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4001/api/v1

  # ─────────────────────────────────────────────────────────────────────────────
  # Marketing site — typecheck + build
  # ─────────────────────────────────────────────────────────────────────────────
  marketing-build:
    name: Marketing — Typecheck & Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check marketing
        run: npm run typecheck --workspace @testcraft/marketing

      - name: Build marketing site
        run: npm run build --workspace @testcraft/marketing
        env:
          NEXT_PUBLIC_LMS_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3001

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E Playwright tests — full stack
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [api-test, web-build, marketing-build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testcraft
          POSTGRES_PASSWORD: testcraft
          POSTGRES_DB: testcraft_e2e
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U testcraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://testcraft:testcraft@localhost:5433/testcraft_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-do-not-use-in-prod
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:4001/api/v1
      NEXT_PUBLIC_LMS_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Apply DB migrations
        run: npm run db:deploy --workspace @testcraft/api

      - name: Seed E2E data
        run: npm run db:seed --workspace @testcraft/api
        env:
          SEED_ADMIN_EMAIL: admin@testcraft.id
          SEED_ADMIN_PASSWORD: "Admin#12345"

      - name: Build API
        run: npm run build --workspace @testcraft/api

      - name: Start API
        run: |
          node apps/api/dist/main.js &
          echo "API_PID=$!" >> $GITHUB_ENV
          npx wait-on http://localhost:4001/api/v1/health --timeout 30000

      - name: Build web (LMS)
        run: npm run build --workspace @testcraft/web

      - name: Start web (LMS)
        run: |
          npm run start --workspace @testcraft/web &
          npx wait-on http://localhost:3000 --timeout 30000

      - name: Build marketing site
        run: npm run build --workspace @testcraft/marketing

      - name: Start marketing site
        run: |
          npm run start --workspace @testcraft/marketing &
          npx wait-on http://localhost:3001 --timeout 30000

      - name: Run Playwright E2E tests
        run: npm run test --workspace @testcraft/e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
