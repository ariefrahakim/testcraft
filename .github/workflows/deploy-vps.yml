name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - staging
          - production
        default: production

jobs:
  deploy:
    name: Deploy — ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment || 'production' }}

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # ── Build + push Docker images ────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/testcraft-api:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/testcraft-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web (LMS) image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/testcraft-web:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/testcraft-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push Marketing image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/marketing/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/testcraft-marketing:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/testcraft-marketing:latest
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing

      # ── Deploy via SSH ────────────────────────────────────────────────────────
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,IMAGE_PREFIX
          script: |
            set -euo pipefail

            DEPLOY_DIR="/opt/testcraft"
            cd "$DEPLOY_DIR"

            echo "==> Pulling images (tag: $IMAGE_TAG)"
            IMAGE_TAG=$IMAGE_TAG \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose -f docker-compose.prod.yml pull

            echo "==> Starting containers"
            IMAGE_TAG=$IMAGE_TAG \
            GITHUB_REPOSITORY=${{ github.repository }} \
              docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans

            echo "==> Running database migrations"
            docker compose -f docker-compose.prod.yml exec -T api \
              node apps/api/dist/scripts/migrate.js || true

            echo "==> Waiting for API health check..."
            for i in $(seq 1 12); do
              if curl -sf http://127.0.0.1:4001/api/v1/health > /dev/null; then
                echo "API is healthy."
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "ERROR: API did not become healthy within 60 s" >&2
                docker compose -f docker-compose.prod.yml logs --tail=50 api
                exit 1
              fi
              echo "Waiting... ($i/12)"
              sleep 5
            done

            echo "==> Deployment complete."
            docker compose -f docker-compose.prod.yml ps
